<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
    body { margin: 0; font-family: sans-serif; background: #0b0f19; color: #f6f7ff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    header { padding: 10px 15px; background: #131828; font-weight: bold; color: #ff79c6; font-size: 16px; border-bottom: 1px solid rgba(255,255,255,0.1); }
    .container { display: grid; grid-template-columns: 1fr 300px; flex: 1; overflow: hidden; }
    .stage { position: relative; display: flex; align-items: center; justify-content: center; background: #0b0f19; }
    .doll { max-height: 90%; max-width: 90%; object-fit: contain; position: absolute; pointer-events: none; }
    .item-img { max-height: 131%; max-width: 131%; object-fit: contain; position: absolute; pointer-events: none; }
    .sidebar { background: #131828; display: flex; flex-direction: column; padding: 10px; overflow-y: auto; border-left: 1px solid rgba(255,255,255,0.1); }
    .tabs { display: flex; gap: 5px; margin-bottom: 8px; flex-wrap: wrap; }
    .tab { background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 12px; }
    .tab.active { background: #ff79c6; color: #111; border-color: #ff79c6; font-weight: bold; }
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; padding: 6px; text-align: center; cursor: pointer; }
    .card:hover { border-color: #ff79c6; background: rgba(255,255,255,0.1); }
    .card img { width: 100%; height: 75px; object-fit: contain; }
    .card div { font-size: 11px; margin-top: 4px; }
    .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; z-index: 100; }
    .modal-box { background: #131828; border: 2px solid #ff79c6; padding: 20px; border-radius: 12px; width: 300px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    .modal-box input { width: 90%; padding: 8px; background: #090c1a; border: 1px solid rgba(255,255,255,0.2); color: #fff; border-radius: 6px; margin: 10px 0; text-align: center; }
    .modal-box button { background: #ff79c6; color: #111; border: none; padding: 8px 16px; font-weight: bold; border-radius: 6px; cursor: pointer; }
</style>
</head>
<body>
<header>Одень принцессу</header>
<div class="container">
    <div class="stage" id="stage">
        <img class="doll" src="https://img.genially.com/6370eab9b3a7e3001249010b/63209193-3f97-4420-b770-b11840be1ab1.png">
    </div>
    <div class="sidebar">
        <div class="tabs" id="tabs"></div>
        <div class="grid" id="grid"></div>
    </div>
</div>
<div class="modal" id="modal">
    <div class="modal-box">
        <h3 style="margin-top:0; color:#ff79c6;">🇬🇧 Вопрос</h3>
        <p id="q-text"></p>
        <input type="text" id="ans-input" placeholder="Ответ..." onkeydown="if(event.key==='Enter')checkAns()">
        <br><button onclick="checkAns()">Проверить</button>
    </div>
</div>
<script>
    const data = {"dollScale":"90","itemScale":"131","categories":[{"name":"Одежда","items":[{"name":"dress","url":"https://img.genially.com/6370eab9b3a7e3001249010b/93e7bfb2-eaef-4101-9397-54c4f1127027.png"},{"name":"jacket","url":"https://img.genially.com/6370eab9b3a7e3001249010b/93e7bfb2-eaef-4101-9397-54c4f1127027.png"}]},{"name":"Обувь","items":[{"name":"shoes","url":"https://img.genially.com/6370eab9b3a7e3001249010b/93e7bfb2-eaef-4101-9397-54c4f1127027.png"}]}],"tasks":[{"q":"What is your name","ans":"dress"},{"q":"How old are you","ans":"shoes"}]};
    let activeCat = 0, targetItem = null, currentTask = null;

    function init() {
        const tabs = document.getElementById("tabs");
        if (!data.categories) return;
        data.categories.forEach((cat, idx) => {
            const btn = document.createElement("button");
            btn.className = "tab " + (idx === 0 ? "active" : "");
            btn.innerText = cat.name;
            btn.onclick = () => {
                document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
                btn.classList.add("active");
                activeCat = idx;
                renderGrid();
            };
            tabs.appendChild(btn);
        });
        renderGrid();
    }

    function renderGrid() {
        const grid = document.getElementById("grid");
        grid.innerHTML = "";
        const cat = data.categories[activeCat];
        if(!cat || !cat.items) return;
        cat.items.forEach(item => {
            const c = document.createElement("div");
            c.className = "card";
            c.innerHTML = '<img src="' + item.url + '"><div>' + item.name + '</div>';
            c.onclick = () => tryEquip(item);
            grid.appendChild(c);
        });
    }

    function tryEquip(item) {
        if(data.tasks && data.tasks.length > 0) {
            targetItem = item;
            currentTask = data.tasks[Math.floor(Math.random() * data.tasks.length)];
            document.getElementById("q-text").innerText = currentTask.q;
            const input = document.getElementById("ans-input");
            input.value = "";
            document.getElementById("modal").style.display = "flex";
            setTimeout(() => input.focus(), 50);
        } else {
            equip(item);
        }
    }

    function checkAns() {
        const val = document.getElementById("ans-input").value.trim().toLowerCase();
        if(val === currentTask.ans) {
            document.getElementById("modal").style.display = "none";
            equip(targetItem);
        } else {
            alert("Неверно, попробуйте еще раз!");
        }
    }

    function equip(item) {
        let ex = document.getElementById("eq-" + activeCat);
        if(ex) ex.remove();
        const img = document.createElement("img");
        img.id = "eq-" + activeCat;
        img.className = "item-img";
        img.src = item.url;
        document.getElementById("stage").appendChild(img);
    }

    init();
</script>
</body>
</html>
