<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Игра с вопросами</title>
    <style>
        body { margin: 0; font-family: sans-serif; background: transparent; color: #fff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        header { padding: 8px 12px; font-weight: bold; color: #ff79c6; font-size: 16px; text-shadow: 0 1px 2px rgba(0,0,0,0.8); }
        .container { display: grid; grid-template-columns: 1fr 280px; flex: 1; overflow: hidden; }
        .stage { position: relative; display: flex; align-items: center; justify-content: center; }
        .doll { max-height: 85%; max-width: 85%; object-fit: contain; position: absolute; pointer-events: none; }
        .sidebar { display: flex; flex-direction: column; padding: 10px; overflow-y: auto; background: rgba(0,0,0,0.2); border-radius: 8px; margin: 5px; }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
        .card { background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.3); border-radius: 8px; padding: 6px; text-align: center; cursor: pointer; }
        .card:hover { border-color: #ff79c6; background: rgba(0,0,0,0.7); }
        .card img { width: 100%; height: 70px; object-fit: contain; }
        .card div { font-size: 11px; margin-top: 4px; text-shadow: 0 1px 2px rgba(0,0,0,0.8); }
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; z-index: 100; }
        .modal-box { background: #1a1a2e; border: 2px solid #ff79c6; padding: 20px; border-radius: 12px; width: 280px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .modal-box input { width: 90%; padding: 8px; background: #0f0f1a; border: 1px solid #444; color: #fff; border-radius: 6px; margin: 10px 0; text-align: center; font-size: 14px; }
        .modal-box button { background: #ff79c6; color: #111; border: none; padding: 8px 16px; font-weight: bold; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>

<header>Одень принцессу</header>

<div class="container">
    <!-- Сцена с куклой и одеждой -->
    <div class="stage" id="stage">
        <!-- Ссылка на куклу (база) -->
        <img class="doll" src="https://i.postimg.cc/3w737X2j/doll-base.png">
    </div>

    <!-- Панель с выбором одежды -->
    <div class="sidebar">
        <h4 style="margin: 0 0 10px 0; color: #ff79c6; font-size: 14px;">Одежда</h4>
        <div class="grid" id="grid">
            <!-- Карточка 1 -->
            <div class="card" onclick="tryEquip('https://i.postimg.cc/Sx5Z5q41/dress.png')">
                <img src="https://i.postimg.cc/Sx5Z5q41/dress.png">
                <div>Платье</div>
            </div>
            <!-- Карточка 2 -->
            <div class="card" onclick="tryEquip('https://i.postimg.cc/1879Q2gW/shoes.png')">
                <img src="https://i.postimg.cc/1879Q2gW/shoes.png">
                <div>Кофта</div>
            </div>
        </div>
    </div>
</div>

<!-- Модальное окно с вопросом -->
<div class="modal" id="modal">
    <div class="modal-box">
        <h3 style="margin-top:0; color:#ff79c6;">🇬🇧 Вопрос</h3>
        <p id="q-text" style="font-size: 14px;"></p>
        <input type="text" id="ans-input" placeholder="Ответ..." onkeydown="if(event.key==='Enter')checkAns()">
        <br>
        <button onclick="checkAns()">Проверить</button>
    </div>
</div>

<script>
    // Список вопросов и правильных ответов (всегда в нижнем регистре)
    const tasks = [
        { q: "Как переводится «платье»?", ans: "dress" },
        { q: "Как переводится «туфли»?", ans: "shoes" }
    ];

    let currentItemUrl = null;
    let currentTask = null;

    function tryEquip(url) {
        currentItemUrl = url;
        // Выбираем случайный вопрос
        currentTask = tasks[Math.floor(Math.random() * tasks.length)];
        
        document.getElementById("q-text").innerText = currentTask.q;
        const input = document.getElementById("ans-input");
        input.value = "";
        
        // Показываем модальное окно
        document.getElementById("modal").style.display = "flex";
        setTimeout(() => input.focus(), 50);
    }

    function checkAns() {
        const val = document.getElementById("ans-input").value.trim().toLowerCase();
        if (val === currentTask.ans) {
            document.getElementById("modal").style.display = "none";
            equipItem(currentItemUrl);
        } else {
            alert("Неверно, попробуйте еще раз!");
        }
    }

    function equipItem(url) {
        // Удаляем старую одежду, если уже была надета
        let oldItem = document.getElementById("equipped-item");
        if (oldItem) oldItem.remove();

        // Надеваем новую
        const img = document.createElement("img");
        img.id = "equipped-item";
        img.className = "doll";
        img.src = url;
        document.getElementById("stage").appendChild(img);
    }
</script>

</body>
</html>
